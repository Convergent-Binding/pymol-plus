# Weekly pull requests for new versions of the GitHub Actions and the pinned Python
# packages; updates are grouped to keep the number low.
# Only versions released at least 14 days ago are proposed (cooldown), so broken
# releases are usually withdrawn or fixed before they reach a pull request.
# The Python packages are those of the app in distribution/, the quick checks' tools
# (checks_requirements.in) included;
# the GitHub Actions updates cover all workflows of the repository.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directories:
      - "/distribution"
      - "/distribution/docs/website"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Newer biopython has no Python 3.13 wheels for Intel Macs
      - dependency-name: "biopython"
        versions: [">1.86"]
      # PySide6 6.10+ needs macOS 13 and glibc 2.34; 6.9 keeps macOS 12 and RHEL/Alma 8
      - dependency-name: "pyside6-essentials"
        versions: [">=6.10"]
      - dependency-name: "shiboken6"
        versions: [">=6.10"]
