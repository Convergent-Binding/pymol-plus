name: Build Wheels

# The C++ (_cmd) builds take 35-40 minutes, so pull requests only build wheels when
# they change something that can end up in a wheel. Release tags (v*) and manual runs
# (Actions > Build Wheels > Run workflow) always build.
on:
  pull_request:
    branches: [production]
    paths-ignore:
      # The ready-to-run app and its workflows and settings
      - 'distribution/**'
      - '.github/workflows/build_app.yaml'
      - '.github/workflows/docs.yaml'
      - '.github/workflows/dependabot_automerge.yaml'
      - '.github/dependabot.yml'
      - '.github/release.yml'
      - '.github/ISSUE_TEMPLATE/**'
      # Documentation and AI tooling
      - 'docs/**'
      - '**/*.md'
      - '.agents/**'
      - '.opencode/**'
      - '.mailmap'
  workflow_dispatch:
  push:
    tags: ["v*"]

# A newer push to a pull request cancels its outdated wheel build
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Each wheel is built by Bazel (//tools/bazel/wheel:wheel) for one CPython
# version, repaired where its platform needs it, installed into a clean
# environment and tested with scripts/test_wheel.py, which runs tests/ with the
# minimum and the latest supported NumPy.
env:
  BAZELISK_VERSION: v1.29.0

jobs:
  # ----- Windows build section
  build-windows:
    name: Windows (x64, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: ${{ github.workflow }}-windows-${{ matrix.python }}

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Build wheel
        run: |
          bazel build \
            --@rules_python//python/config_settings:python_version=${{ matrix.python }} \
            //tools/bazel/wheel:wheel

      # As cibuildwheel did: delvewheel bundles the MSVC C++ runtime
      # (msvcp140) and the OpenMP runtime (vcomp140) the extension links.
      - name: Repair wheel
        run: |
          PYTAG="cp${PY//./}"
          python -m pip install --disable-pip-version-check delvewheel
          python -m delvewheel repair -w wheelhouse \
            bazel-bin/tools/bazel/wheel/pymol_open_source_whl-*-"$PYTAG"-"$PYTAG"-win_amd64.whl
          python scripts/check_wheel_member.py wheelhouse vcomp140
        env:
          PY: ${{ matrix.python }}

      - name: Test wheel
        run: |
          python -m venv .wheel-test
          .wheel-test/Scripts/python -m pip install --disable-pip-version-check pytest importlib_metadata wheelhouse/*.whl
          .wheel-test/Scripts/python scripts/test_wheel.py
        env:
          PYMOL_WHEEL_TEST_REPORTS: build/wheel-test-results

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyMOL-wheel-Windows-x64-${{ matrix.python }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

      - name: Upload wheel test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wheel-tests-Windows-x64-${{ matrix.python }}
          path: ./build/wheel-test-results/*.xml
          if-no-files-found: warn
  # --- end

  # ----- macOS build section
  build-macos:
    name: macOS (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-15-intel, macos-15 ]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.os }}-${{ matrix.python }}

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # The wheels link only system frameworks and Bazel-built static
      # libraries, so there is nothing for delocate to bundle (the CMake-built
      # wheels carried no .dylibs either).
      - name: Build wheel
        run: |
          bazel build \
            --@rules_python//python/config_settings:python_version=${{ matrix.python }} \
            //tools/bazel/wheel:wheel
          PYTAG="cp${PY//./}"
          mkdir -p wheelhouse
          cp bazel-bin/tools/bazel/wheel/pymol_open_source_whl-*-"$PYTAG"-"$PYTAG"-macosx_*.whl wheelhouse/
        env:
          PY: ${{ matrix.python }}

      - name: Test wheel
        run: |
          python -m venv .wheel-test
          .wheel-test/bin/python -m pip install --disable-pip-version-check pytest importlib_metadata wheelhouse/*.whl
          .wheel-test/bin/python scripts/test_wheel.py
        env:
          PYMOL_WHEEL_TEST_REPORTS: build/wheel-test-results

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyMOL-wheel-${{ matrix.os }}-${{ matrix.python }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

      - name: Upload wheel test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wheel-tests-${{ matrix.os }}-${{ matrix.python }}
          path: ./build/wheel-test-results/*.xml
          if-no-files-found: warn
  # --- end

  # ----- GNU Linux build section
  build-gnu-linux:
    name: GNU/Linux (x64, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ubuntu-22.04
    # PyPA's manylinux_2_28 image, as cibuildwheel used: its gcc-toolset keeps
    # C++17 code inside the manylinux_2_28 policy.
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The checkout belongs to another user than the container's root, and
      # git refuses such a repository; the build-info header's git SHA comes
      # from `git rev-parse HEAD` (tools/bazel/workspace_status.sh).
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The image ships no bazel; bazelisk honours .bazelversion.
      - name: Install bazelisk
        run: |
          curl -fsSL -o /usr/local/bin/bazel \
            "https://github.com/bazelbuild/bazelisk/releases/download/${BAZELISK_VERSION}/bazelisk-linux-amd64"
          chmod +x /usr/local/bin/bazel
          bazel --version

      - name: Install OpenGL development headers
        run: dnf install -y mesa-libGL-devel

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: ${{ github.workflow }}-linux-${{ matrix.python }}

      - name: Build wheel
        run: |
          bazel build \
            --@rules_python//python/config_settings:python_version=${{ matrix.python }} \
            //tools/bazel/wheel:wheel

      # The Bazel wheel is tagged linux_x86_64; auditwheel retags it with the
      # policy its binaries satisfy and bundles libgomp, which no manylinux
      # policy allows a wheel to expect on the system.
      - name: Repair wheel
        run: |
          PYTAG="cp${PY//./}"
          auditwheel repair --plat manylinux_2_28_x86_64 -w wheelhouse \
            bazel-bin/tools/bazel/wheel/pymol_open_source_whl-*-"$PYTAG"-"$PYTAG"-linux_x86_64.whl
          auditwheel show wheelhouse/*.whl
          "/opt/python/$PYTAG-$PYTAG/bin/python" scripts/check_wheel_member.py wheelhouse pymol_open_source_whl.libs/libgomp
        env:
          PY: ${{ matrix.python }}

      - name: Test wheel
        run: |
          PYTAG="cp${PY//./}"
          "/opt/python/$PYTAG-$PYTAG/bin/python" -m venv .wheel-test
          .wheel-test/bin/python -m pip install --disable-pip-version-check pytest importlib_metadata wheelhouse/*.whl
          .wheel-test/bin/python scripts/test_wheel.py
        env:
          PY: ${{ matrix.python }}
          PYMOL_WHEEL_TEST_REPORTS: build/wheel-test-results

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyMOL-wheel-GNU-Linux-${{ matrix.python }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

      - name: Upload wheel test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wheel-tests-GNU-Linux-${{ matrix.python }}
          path: ./build/wheel-test-results/*.xml
          if-no-files-found: warn
  # --- end

  release-integrity:
    name: Validate release distributions
    needs: [build-windows, build-macos, build-gnu-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: PyMOL-wheel-*
          path: dist
          merge-multiple: true

      - name: Install distribution validation tools
        run: python -m pip install --disable-pip-version-check twine

      - name: Validate distribution metadata
        run: python -m twine check dist/*.whl

      - name: Verify release metadata and wheel coverage
        run: python scripts/verify_release.py --dist dist

      - name: Verify release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/verify_release.py --dist dist --tag "$GITHUB_REF_NAME"

      - name: Upload validated distributions
        uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: dist/*.whl
          if-no-files-found: error

  attest:
    name: Attest release distributions
    needs: release-integrity
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      attestations: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.whl

  publish:
    name: Publish distributions to PyPI
    needs: attest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pymol-open-source-whl
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
