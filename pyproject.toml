# The wheels are built by Bazel (bazel build //tools/bazel/wheel:wheel); see
# "Build wheel file" in README.md. The table is not simply deleted: without it pip
# falls back to setuptools, which would build this [project] metadata into a
# wheel with none of the compiled extensions -- installable, and broken at
# `import pymol._cmd`. The in-tree backend refuses with an explanation instead.
[build-system]
requires = []
build-backend = "pymol_build_backend"
backend-path = ["tools/build_backend"]

# Bazel reads name, version, requires-python and dependencies from this table
# (tools/bazel/pyproject_repo.bzl); keep them as plain strings and string lists.
[project]
name = "pymol-open-source-whl"
readme = "README.md"
version = "3.2.0.3"
requires-python = ">=3.10"
license = {file = "LICENSE"}
#description = """
#PyMOL is a Python-enhanced molecular graphics tool.
#It excels at 3D visualization of proteins, small molecules, density,
#surfaces, and trajectories. It also includes molecular editing,
#ray tracing, and movies. Open Source PyMOL is free to everyone!
#"""
authors = [
  {name = "Martin Urban", email = "martin.urban@studmail.w-hs.de"},
]
dependencies = [
  "numpy>=2.2",
]

[project.urls]
# Homepage = "https://pymol.org"
Documentation = "https://pymolwiki.org/index.php/Main_Page"
Repository = "https://github.com/urban233/pymol-open-source-whl"
